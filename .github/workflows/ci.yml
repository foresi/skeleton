# SPDX-License-Identifier: AGPL-3.0-only
#
# Proves the skeleton as a self-hoster gets it: the packages from Packagist, an
# empty PostgreSQL, the migrations, and the login page.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: foresi
          POSTGRES_PASSWORD: foresi
          POSTGRES_DB: foresi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foresi" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: prod
      APP_DEBUG: '0'
      APP_SECRET: ci-only-secret-0123456789abcdef
      DATABASE_URL: postgresql://foresi:foresi@127.0.0.1:5432/foresi?serverVersion=17&charset=utf8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, dom, gd, iconv, intl, sodium, zip, pdo_pgsql
          tools: composer:v2
      # A self-hoster keeps the secrets in .env.local (ops/deploy.sh shares it
      # between releases). The built-in web server below does not see the job's
      # environment in $_SERVER, so without this file .env's empty APP_SECRET wins.
      - name: Write .env.local
        run: |
          {
            echo "APP_ENV=$APP_ENV"
            echo "APP_DEBUG=$APP_DEBUG"
            echo "APP_SECRET=$APP_SECRET"
            echo "DATABASE_URL=\"$DATABASE_URL\""
          } > .env.local
      - name: Install from Packagist
        run: composer install --no-dev --no-progress --optimize-autoloader
      - name: Build the assets
        run: |
          php bin/console tailwind:build --minify
          php bin/console asset-map:compile
      - name: Migrate an empty database
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:schema:validate
      - name: Events are catalogued
        run: test "$(php bin/console app:events | grep -c '\.')" -gt 0
      - name: The login page answers
        run: |
          php -S 127.0.0.1:8000 -t public > /tmp/server.log 2>&1 &
          sleep 2
          curl --fail --silent --show-error --output /tmp/login.html http://127.0.0.1:8000/login
          for asset in $(grep -oE '(href|src)="/assets/[^"]+"' /tmp/login.html | cut -d'"' -f2); do
            curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:8000$asset"
          done
      - name: Logs
        if: failure()
        run: |
          cat /tmp/server.log || true
          tail -n 200 var/log/*.log || true
